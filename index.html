/* Layout: sticky tab bar + scope picker on top, one study view below; Turkish always left, Kazakh right. */
:root{
  --bg:#f3f6fc; --surface:#ffffff; --ink:#0d1a36; --muted:#586987; --line:#d8e0ef;
  --accent:#1c4fd8; --accent-ink:#ffffff; --soft:#e7eeff; --navy:#0b2a5b;
  --good:#12803f; --good-soft:#dcf4e5; --bad:#b42318; --bad-soft:#fde3e0; --warn:#9a5a06; --warn-soft:#fcefd2;
  --r:12px; --f:'Sozdik Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09112a; --surface:#101b3a; --ink:#e8eefc; --muted:#93a4c8; --line:#223260;
  --accent:#6b9cff; --accent-ink:#06122e; --soft:#16264f; --navy:#9db9ff;
  --good:#4cc786; --good-soft:#0f2f22; --bad:#ff8a80; --bad-soft:#3a1717; --warn:#f2b45a; --warn-soft:#352610; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09112a; --surface:#101b3a; --ink:#e8eefc; --muted:#93a4c8; --line:#223260;
  --accent:#6b9cff; --accent-ink:#06122e; --soft:#16264f; --navy:#9db9ff;
  --good:#4cc786; --good-soft:#0f2f22; --bad:#ff8a80; --bad-soft:#3a1717; --warn:#f2b45a; --warn-soft:#352610; color-scheme:dark}
/* colour palettes: JS always sets data-theme (light/dark); data-pal picks the accent family */
:root[data-pal="green"][data-theme="light"]{--bg:#f1f8f4;--line:#d2e6da;--muted:#53695d;--accent:#0e7a4f;--accent-ink:#fff;--soft:#e0f3e9;--navy:#0b4a33}
:root[data-pal="green"][data-theme="dark"]{--bg:#08170f;--surface:#0f2218;--ink:#e6f4ec;--muted:#94b3a2;--line:#1f3a2b;--accent:#4fd18d;--accent-ink:#052414;--soft:#13301f;--navy:#9fe0bf}
:root[data-pal="graphite"][data-theme="light"]{--bg:#f4f4f5;--surface:#fff;--ink:#18181b;--muted:#606066;--line:#dcdce0;--accent:#27272a;--accent-ink:#fff;--soft:#ececee;--navy:#27272a}
:root[data-pal="graphite"][data-theme="dark"]{--bg:#0b0b0d;--surface:#151518;--ink:#ededf0;--muted:#9a9aa3;--line:#2a2a30;--accent:#d4d4d8;--accent-ink:#111;--soft:#222226;--navy:#d4d4d8}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
.fc,.mc,.pb,.bk,.tile,.nb,.lt,.ky,.tk,.btn,.chip,.opt,.slot,.q,.hw,.spk,.ls{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.search,.scope select{font-size:16px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
:root[data-theme="dark"] .logo{color:#09112a}
h1{font-size:19px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-bottom:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scope{display:flex;gap:8px;align-items:center;margin-top:8px}
.scope select{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font:inherit}
.count{flex:none;font-size:13px;color:var(--muted);white-space:nowrap}
.bpbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bpbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
main{padding-block:10px 96px}
#subnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#subnav:empty{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navi{max-width:760px;margin:0 auto;display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

<script>
(function(){
"use strict";
var W=JSON.parse(document.getElementById('data').textContent);
var BY={};W.forEach(function(w,i){w.i=i;BY[w.id]=w;});
var IS_PWA=true;
var APP_VER='1.0.1';
var S={theme:'',scope:'all',dir:'tk',st:{},star:{},hide:false,hideKnown:false,tab:'today',last:{},auto:false,rate:0.9,box:{},day:{},hit:{},xp:0,goal:10,newPer:5};
try{var _s=JSON.parse(localStorage.getItem('sozdik-v1')||'{}');for(var k in _s)S[k]=_s[k];}catch(e){}
function save(){try{localStorage.setItem('sozdik-v1',JSON.stringify(S));}catch(e){}}
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
function fm(w){return w.kk.split(/[;,]/)[0].trim()}
function meanings(w){return w.kk.split(/[;,]/).map(function(x){return x.trim().toLowerCase()})}
var CATS=['Етістік','Отбасы','Уақыт, сан','Қарама-қарсы','Табиғат','Діни ұғымдар','Заттар','Адамдар'];
var tabs=[['today','Бүгін'],['list','Сөздік'],['cards','Карточка'],['test','Тест'],['pairs','Жұптау'],['group','Топқа бөлу'],['games','Ойындар'],['hub','Ойындар'],['prog','Жетістік'],['fix','Түзетулер']];
var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

/* ---------- scope ---------- */
var LS=20;
function lessonCount(){return Math.ceil(W.length/LS)}
function pool(){
  var sc=S.scope;
  if(sc==='all')return W;
  if(sc==='wrong')return W.filter(function(w){return S.st[w.id]==1});
  if(sc==='star')return W.filter(function(w){return S.star[w.id]});
  if(sc==='fix')return W.filter(function(w){return w.f==='!'||w.f==='?'});
  if(sc.charAt(0)==='L'){var n=+sc.slice(1);return W.slice((n-1)*LS,n*LS)}
  if(sc.charAt(0)==='C'){var c=sc.slice(2);return W.filter(function(w){return w.c===c})}
  return W;
}
function buildScope(){
  var h='<option value="all">Барлық сөздер ('+W.length+')</option>';
  h+='<option value="wrong">Қайталау керек ('+W.filter(function(w){return S.st[w.id]==1}).length+')</option>';
  h+='<option value="star">Жұлдызшалылар ('+Object.keys(S.star).filter(function(k){return S.star[k]}).length+')</option>';
  h+='<optgroup label="Тақырып бойынша">';
  CATS.forEach(function(c){h+='<option value="C:'+c+'">'+c+' ('+W.filter(function(w){return w.c===c}).length+')</option>'});
  h+='</optgroup><optgroup label="Сабақтар (әрқайсысы 20 сөз)">';
  for(var n=1;n<=lessonCount();n++){var a=(n-1)*LS,b=Math.min(n*LS,W.length);h+='<option value="L'+n+'">Сабақ '+n+' · '+(a+1)+'–'+b+' '+starStr(lessonStars(n))+'</option>'}
  h+='</optgroup>';
  var sel=$('#scope');sel.innerHTML=h;sel.value=S.scope;
  if(sel.value!==S.scope){S.scope='all';sel.value='all'}
}
function updateHead(){
  var P=pool();var known=P.filter(function(w){return S.st[w.id]==2}).length;
  $('#cnt').textContent=P.length+' сөз';
  $('#pbar').style.width=(P.length?known/P.length*100:0)+'%';
  var all=W.filter(function(w){return S.st[w.id]==2}).length;
  $('#sub').textContent='Деңгей '+level()+' · серия '+streak()+' күн · '+all+' / '+W.length;
}
var SPK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function spk(t,big){return '<button class="spk'+(big?' lg':'')+'" data-a="spk" data-t="'+esc(t)+'" aria-label="Тыңдау" title="Тыңдау">'+SPK+'</button>'}
var voiceTr=null;
function pickVoice(){try{var v=speechSynthesis.getVoices();voiceTr=v.filter(function(x){return /^tr/i.test(x.lang)})[0]||null;return v.length}catch(e){return 0}}
function speak(t){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('Бұл құрылғыда дыбыстау жоқ');return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(String(t).replace(/\s+[–—-]\s+/g,'. '));u.lang='tr-TR';u.rate=S.rate||0.9;
    var n=pickVoice();if(voiceTr)u.voice=voiceTr;else if(n>0)toast('Түрікше дауыс табылмады. Телефон баптауынан түрік тілін қосыңыз');
    speechSynthesis.speak(u);
  }catch(e){toast('Дыбыстау қолжетімсіз')}
}
function autoSpeak(t){if(S.auto)speak(t)}
try{if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
var INT=[0,1,2,4,8,16,32];
var TITLES=['Жаңадан бастаушы','Оқушы','Үйренуші','Білімпаз','Шебер','Ізденуші','Түрік тілінің білгірі','Данышпан'];
function dn(){var d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
function ds(n){return new Date(n*864e5).toISOString().slice(0,10)}
function level(){return Math.floor(S.xp/200)+1}
function title(l){return TITLES[Math.min(TITLES.length-1,Math.floor((l-1)/2))]}
function streak(){var d=dn(),n=0;if(!S.hit[ds(d)])d--;while(S.hit[ds(d)]){n++;d--}return n}
var tt=null;
function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2600)}
function gain(x){var o=level();S.xp+=x;if(level()>o)toast('Жаңа деңгей: '+level()+' · '+title(level()))}
function rate(id,ok,xp){
  var b=S.box[id]||{b:0,d:0},t=dn();
  if(ok){
    if(!(S.box[id]&&b.d>t)){b.b=Math.min(6,b.b+1);b.d=t+INT[b.b]}
    gain(xp==null?10:xp);
    var k=ds(t);S.day[k]=(S.day[k]||0)+1;
    if(S.day[k]>=S.goal&&!S.hit[k]){S.hit[k]=1;toast('Бүгінгі мақсат орындалды! Серия: '+streak()+' күн')}
  }else{b.b=0;b.d=t;if(xp)gain(xp)}
  S.box[id]=b;S.st[id]=b.b>=3?2:1;save();
}
function setSt(id,v){
  S.st[id]=v;
  if(v===2)S.box[id]={b:3,d:dn()+INT[3]};else if(v===1)S.box[id]={b:0,d:dn()};else delete S.box[id];
  save();
}
function lessonStars(n){var a=W.slice((n-1)*LS,n*LS),k=a.filter(function(w){return S.st[w.id]==2}).length,r=k/a.length;return r>=1?3:r>=.8?2:r>=.5?1:0}

        else{P2.left=P2.rounds[P2.r].length;P2.rt=roundTexts();P2.lo=null;P2.selL=P2.selR=null;drawPairs()}
      },450);

/* hangman */
var ALPHA='abcçdefgğhıijklmnoöprsştuüvyz'.split('');
function newHang(keep){
  var P=pool().filter(function(w){return /^[^\s,;\/()–\-]{4,10}$/.test(w.tr)});
  if(P.length<3){GM.hang={state:'none'};return}
  var w=P[Math.floor(Math.random()*P.length)],word=norm(w.tr.toLocaleLowerCase('tr')),g={};
  word.split('').forEach(function(ch){if(ALPHA.indexOf(ch)<0)g[ch]=1});
  GM.hang={state:'run',id:w.id,word:word,g:g,miss:{},lives:6,score:keep&&GM.hang?GM.hang.score:0};
}
function hangWon(h){return h.word.split('').every(function(ch){return h.g[ch]})}

  var b=$('#gbody');if(!GM.hang)newHang();var h=GM.hang;
  if(h.state==='none'){b.innerHTML=notEnough(3).replace('кемінде 3 сөз','кемінде 3 бір сөзді жазба');return}

  if(h.state==='win')o+='<div style="text-align:center;font-weight:700;color:var(--good)">Дұрыс! '+esc(w.tr)+' '+spk(w.tr)+'</div><button class="btn pri" data-a="hnext">Келесі сөз</button>';
  else if(h.state==='lose')o+='<div style="text-align:center;font-weight:700;color:var(--bad)">Дұрыс жауап: '+esc(w.tr)+' '+spk(w.tr)+'</div><button class="btn pri" data-a="hnext">Келесі сөз</button>';
  else{o+='<div class="kb">';ALPHA.forEach(function(ch){var c=h.g[ch]&&h.word.indexOf(ch)>=0&&ALPHA.indexOf(ch)>=0?' hit':h.miss[ch]?' miss':'';o+='<button class="ky'+c+'" data-a="hg" data-v="'+ch+'"'+((h.g[ch]||h.miss[ch])?' disabled':'')+'>'+ch.toUpperCase()+'</button>'});o+='</div>'}

function norm(s){return s.replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u')}
function scrWords(){return pool().filter(function(w){var t=w.tr;return /^[^\s,;\/()–\-]{3,11}$/.test(t)})}
function newScr(){

  var w=BY[s.q[s.i]],n=w.tr.length,h='<div class="card stack"><div class="prog"><span>'+(s.i+1)+' / '+s.q.length+'</span><span>Дұрыс: '+s.ok+'</span></div><div class="muted" style="text-align:center">Мағынасы</div><div class="q" style="padding-block:4px">'+esc(w.kk)+'</div><div class="slots" id="slots">';

function scrTap(i){
  var s=GM.scr,w=BY[s.q[s.i]];if(s.used[i]||s.res==='ok')return;
  s.res='';s.used[i]=1;s.ans.push({ch:s.letters[i].ch,li:i});

  }

}

function fallbackCopy(t,done){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Көшіру мүмкін болмады')}ta.remove()}

var BK_KEYS=['theme','mode','pal','scope','dir','st','star','hide','hideKnown','last','auto','rate','box','day','hit','xp','goal','newPer','tab','hintOff'];

  var b=new Blob([text],{type:'application/json'});

  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
  toast('Файл сақталды');
}
function restoreText(txt){
  var o;try{o=JSON.parse(txt)}catch(e){return 'Мәтін дұрыс емес. Сақталған мәтінді толық көшіріп қойыңыз.'}

  if(!d||typeof d!=='object'||!d.st||typeof d.st!=='object')return 'Бұл сөздіктің сақтау файлы емес.';

/* ---------- actions ---------- */
function act(a,el){
  var id=+el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab':go(v);break;
    case 'nav':go(S.tab&&SEC[S.tab]===v?sectionRoot(v):((S.last&&S.last[v])||sectionRoot(v)));break;
    case 'game':if(v==='test'||v==='pairs'||v==='group')go(v);else{GM.sub=v;go('games')}break;
    case 'open':UI.open[id]=!UI.open[id];var wrap=el.closest('.w');wrap.outerHTML=rowHtml(BY[id]);break;
    case 'star':S.star[id]=!S.star[id];save();var w2=view().querySelector('.w[data-id="'+id+'"]');if(w2)w2.outerHTML=rowHtml(BY[id]);buildScope();$('#scope').value=S.scope;break;
    case 'st':setSt(id,+v);var w3=view().querySelector('.w[data-id="'+id+'"]');if(w3)w3.outerHTML=rowHtml(BY[id]);updateHead();break;
    case 'more':UI.limit+=60;listBody();break;
    case 'hide':S.hide=!S.hide;save();UI.open={};vList();break;
    case 'dir':S.dir=S.dir==='tk'?'kt':'tk';save();if(S.tab==='cards'){startCards();drawCards()}else drawTest();break;
    case 'dir1':S.dir='tk';save();drawTest();break;
    case 'dir2':S.dir='kt';save();drawTest();break;
    case 'hk':S.hideKnown=!S.hideKnown;save();startCards();drawCards();break;
    case 'restart':startCards();drawCards();break;
    case 'flip':C.flip=!C.flip;drawCards();break;
    case 'again':var cw=C.q[C.i];rate(cw,false);C.again++;C.i++;C.flip=false;updateHead();drawCards();break;
    case 'knew':rate(C.q[C.i],true,5);C.known++;C.i++;C.flip=false;updateHead();drawCards();break;
    case 'goWrong':S.scope='wrong';save();go('cards');startCards();drawCards();break;
    case 'tn':T.n=+v;drawTest();break;
    case 'tstart':startTest();break;
    case 'tsetup':T.state='setup';drawTest();break;
    case 'twrong':startTest(T.wr.slice());break;
    case 'ans':
      if(T.sel>=0)break;var q=T.qs[T.i];T.sel=+v;
      if(T.sel===q.a){T.score++;rate(q.id,true)}else{T.wr.push(q.id);rate(q.id,false)}
      updateHead();drawTest();break;
    case 'tnext':T.i++;T.sel=-1;if(T.i>=T.qs.length)T.state='end';drawTest();break;
    case 'pstart':P2.lo=null;startPairs();break;
    case 'pl':pairPick('l',id);break;
    case 'pr':pairPick('r',id);break;
    case 'gsub':G.sub=v;vGroup();break;
    case 'gcat':var ix=G.cats.indexOf(v);if(ix>=0)G.cats.splice(ix,1);else if(G.cats.length<4)G.cats.push(v);vGroup();break;
    case 'gstart':gStart();break;
    case 'gsetup':G.state='setup';vGroup();break;
    case 'gkk':G.showKk=!G.showKk;vGroup();break;
    case 'gpick':
      var gw=BY[G.items[G.i]];
      if(G.cats[+v]===gw.c){G.ok++;G.i++;G.bad=-1;if(G.i>=G.items.length)G.state='end';vGroup()}
      else{G.mis++;G.bad=+v;vGroup();setTimeout(function(){G.bad=-1},400)}
      break;
    case 'cyc':var cur=S.st[id]||0;setSt(id,cur===0?1:cur===1?2:0);updateHead();buildScope();$('#scope').value=S.scope;vGroup();break;
    case 'msub':GM.sub=v;stopTimer();vGames();break;
    case 'scrnew':newScr();drawScr();break;
    case 'slt':scrTap(+v);break;
    case 'sback':var s=GM.scr;if(s.res==='ok')break;var ai=+v;if(s.ans.length>ai){var rm=s.ans.splice(ai);rm.forEach(function(r){delete s.used[r.li]});s.res='';drawScr()}break;
    case 'sclr':GM.scr.ans=[];GM.scr.used={};GM.scr.res='';drawScr();break;
    case 'sskip':rate(BY[GM.scr.q[GM.scr.i]].id,false);scrNext();break;
    case 'fstart':fStart();break;
    case 'fa':
      var f=GM.fast;if(f.state!=='run')break;
      if((+v===1)===f.cur.truth){f.ok++;rate(f.cur.w.id,true,5)}else{f.bad++;rate(f.cur.w.id,false)}
      f.n++;fastQ();drawFast();break;
    case 'fxf':FX.f=v;vFix();break;
    case 'mnew':newMem();drawMem();break;
    case 'mflip':
      var mm=GM.mem;if(!mm||mm.lock)break;var mc=mm.cs[+v];if(mc.open||mc.done)break;mc.open=true;mm.sel.push(mc);
      if(mm.sel.length===2){
        mm.moves++;var ma=mm.sel[0],mb=mm.sel[1];
        if(ma.id===mb.id&&ma.k!==mb.k){ma.done=mb.done=true;mm.left--;rate(ma.id,true,5);mm.sel=[];if(mm.left===0)mm.state='end';updateHead()}
        else{mm.lock=true;drawMem();setTimeout(function(){ma.open=false;mb.open=false;mm.sel=[];mm.lock=false;if(gOn('mem'))drawMem()},800);break}
      }
      drawMem();break;
    case 'hg':
      var hh=GM.hang;if(!hh||hh.state!=='run')break;
      if(hh.word.indexOf(v)>=0){hh.g[v]=1;if(hangWon(hh)){hh.state='win';hh.score++;rate(hh.id,true,10);updateHead()}}
      else{hh.miss[v]=1;hh.lives--;if(hh.lives<=0){hh.state='lose';rate(hh.id,false);updateHead()}}
      drawHang();break;
    case 'hnext':newHang(true);drawHang();break;
    case 'tynew':newType();drawType();break;
    case 'tych':var tie=$('#ti');if(tie){tie.value+=v;tie.focus()}break;
    case 'tycheck':
      var ty=GM.type,tv=$('#ti')?$('#ti').value:'';if(!ty||ty.fb||!tv.trim())break;
      var tw=BY[ty.q[ty.i]],parts=tw.tr.split(/[,;\/]/).concat([tw.tr]);
      var ex=parts.some(function(x){return exactT(x)===exactT(tv)}),fo=parts.some(function(x){return foldT(x)===foldT(tv)});
      if(ex){ty.fb={k:'ok'};ty.ok++;rate(tw.id,true,10)}else if(fo){ty.fb={k:'near'};ty.ok++;rate(tw.id,true,5)}else{ty.fb={k:'no'};rate(tw.id,false)}
      updateHead();drawType();break;
    case 'tynext':GM.type.i++;GM.type.fb=null;if(GM.type.i>=GM.type.q.length)GM.type.state='end';drawType();break;
    case 'spk':speak(el.dataset.t);break;
    case 'rep':var rw=BY[id];copyText('№'+rw.id+' '+rw.tr+' – '+rw.kk+' (қате бар)','Көшірілді. Мәтінді маған жіберіңіз');break;
    case 'hint':S.hintOff=true;save();drawToday();break;
    case 'bkcopy':copyText(backupText(),'Көшірілді. Мәтінді жақсы жерге сақтап қойыңыз');break;
    case 'bkfile':saveFile('turik-sozdik-'+new Date().toISOString().slice(0,10)+'.json',backupText());break;
    case 'bkpaste':UI.bkPaste=!UI.bkPaste;vProg();break;
    case 'bkgo':var bt=$('#bkt'),bm=restoreText(bt?bt.value:'');if(bm){$('#bkmsg').textContent=bm}else{UI.bkPaste=false;toast('Прогресс қалпына келтірілді');render()}break;
    case 'reset':UI.reset=true;vProg();break;
    case 'resetno':UI.reset=false;vProg();break;
    case 'resetyes':S.st={};S.star={};S.box={};S.day={};S.hit={};S.xp=0;UI.reset=false;save();toast('Прогресс өшірілді');render();break;
    case 'pal':S.pal=v;save();applyTheme();vProg();break;
    case 'mode':S.mode=v;save();applyTheme();vProg();break;
    case 'auto':S.auto=!S.auto;save();vProg();break;
    case 'rate':S.rate=+v;save();vProg();break;
    case 'rstart':rStart();break;
    case 'rhome':R={state:'home',q:[],i:0,flip:false,ok:0,fail:0,retry:{}};drawToday();updateHead();break;
    case 'rflip':R.flip=true;drawSrs();break;
    case 'rfail':var rid=R.q[R.i];if(!R.retry[rid]){rate(rid,false);R.fail++;R.retry[rid]=1;R.q.push(rid)}R.i++;R.flip=false;updateHead();drawSrs();break;
    case 'rknow':rate(R.q[R.i],true,10);R.ok++;R.i++;R.flip=false;updateHead();drawSrs();break;
    case 'newper':S.newPer=+v;save();drawToday();break;
    case 'goal':S.goal=+v;save();vProg();break;
    case 'lesson':S.scope='L'+v;save();go('list');break;
  }
}
var SW=null,swSup=false;
function swReset(c){c.style.transition='transform .2s,opacity .2s';c.style.transform='';c.style.borderColor='';c.style.opacity=''}
function swGrade(mode,right){
  if(mode==='srs')act(right?'rknow':'rfail',document.body);
  else act(right?'knew':'again',document.body);
}
view().addEventListener('pointerdown',function(e){
  var c=e.target.closest('.fc[data-swipe]');if(!c||e.target.closest('button'))return;
  SW={c:c,x:e.clientX,y:e.clientY,dx:0,id:e.pointerId,mode:c.dataset.swipe,moved:false};
  try{c.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',function(e){
  if(!SW||e.pointerId!==SW.id)return;
  var dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.moved&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>14){swReset(SW.c);SW=null;return}
  if(Math.abs(dx)>8)SW.moved=true;
  if(!SW.moved)return;
  SW.dx=dx;var c=SW.c;c.style.transition='none';
  c.style.transform='translateX('+dx+'px) rotate('+(dx/28)+'deg)';
  c.style.borderColor=dx>0?'var(--good)':'var(--bad)';
  c.style.opacity=String(1-Math.min(.5,Math.abs(dx)/420));
});
function swEnd(e){
  if(!SW||e.pointerId!==SW.id)return;
  var c=SW.c,dx=SW.dx,m=SW.mode,mv=SW.moved;SW=null;
  if(mv){swSup=true;setTimeout(function(){swSup=false},350)}
  if(Math.abs(dx)>90&&e.type==='pointerup'){
    c.style.transition='transform .2s,opacity .2s';
    c.style.transform='translateX('+(dx>0?520:-520)+'px) rotate('+(dx>0?18:-18)+'deg)';c.style.opacity='0';
    setTimeout(function(){swGrade(m,dx>0)},170);
  }else swReset(c);
}
document.addEventListener('pointerup',swEnd);
document.addEventListener('pointercancel',swEnd);
document.addEventListener('keydown',function(e){
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;
  if(S.tab==='cards'&&C.q.length&&C.i<C.q.length){if(e.key==='ArrowRight')act('knew',document.body);else if(e.key==='ArrowLeft')act('again',document.body);else if(e.key===' '){e.preventDefault();act('flip',document.body)}}
  else if(S.tab==='today'&&R.state==='run'&&R.i<R.q.length){if(!R.flip&&(e.key===' '||e.key==='Enter')){e.preventDefault();act('rflip',document.body)}else if(R.flip){if(e.key==='ArrowRight')act('rknow',document.body);else if(e.key==='ArrowLeft')act('rfail',document.body)}}
});
document.addEventListener('click',function(e){
  if(swSup){e.preventDefault();e.stopPropagation();return}
  var b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='open'&&e.target.closest('.star'))return;
  act(b.dataset.a,b);
});
$('#scope').addEventListener('change',function(e){
  S.scope=e.target.value;save();UI.limit=60;UI.open={};
  C.q=[];C.started=false;T.state='setup';P2.state='setup';P2.lo=null;GM.scr=null;GM.fast=null;
  render();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='ti'){e.preventDefault();act('tycheck',e.target)}});
$('#themeBtn').addEventListener('click',function(){S.mode=resolveDark()?'light':'dark';save();applyTheme();if(S.tab==='prog')vProg()});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
applyTheme();
if(!tabs.some(function(t){return t[0]===S.tab}))S.tab='list';
render();
})();
</script>

<script>
setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('off');setTimeout(function(){s.remove()},600)}},1400);
if('serviceWorker' in navigator){
  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;reloading=true;location.reload()});
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      function offer(w){var b=document.getElementById('upd');b.hidden=false;document.getElementById('updb').onclick=function(){w.postMessage('SKIP')}}
      if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
      reg.addEventListener('updatefound',function(){var n=reg.installing;n.addEventListener('statechange',function(){if(n.state==='installed'&&navigator.serviceWorker.controller)offer(n)})});
      setInterval(function(){reg.update()},3600000);
    }).catch(function(){});
  });
}
</script>
</body></html>
